name: Build TL-7DR7299 kmod-mtd-rw

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            curl \
            ca-certificates

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth=1 \
            --branch mt798x-mt799x-6.6-mtwifi \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git \
            immortalwrt

      - name: Show source information
        working-directory: immortalwrt
        run: |
          echo "===== SOURCE ====="
          git log -1 --oneline
          echo
          echo "===== BRANCH ====="
          git branch --show-current

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create mtd-rw package source
        working-directory: immortalwrt
        run: |
          mkdir -p package/kernel/mtd-rw/src
          
          # 直接从权威源下载 mtd-rw.c 驱动文件
          curl -sSL https://raw.githubusercontent.com/phrack/mtd-rw/master/mtd-rw.c -o package/kernel/mtd-rw/src/mtd-rw.c
          
          # 创建标准的 OpenWrt 包 Makefile
          cat > package/kernel/mtd-rw/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          include $(INCLUDE_DIR)/kernel.mk

          PKG_NAME:=mtd-rw
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define KernelPackage/mtd-rw
            SUBMENU:=Other modules
            TITLE:=Write-enable module for MTD partitions
            FILES:=$(PKG_BUILD_DIR)/mtd-rw.ko
            AUTOLOAD:=$(call AutoLoad,50,mtd-rw)
          endef

          define KernelPackage/mtd-rw/description
            Driver to make MTD partitions writeable.
          endef

          define Build/Compile
            $(MAKE) -C "$(LINUX_DIR)" \
              KERNEL_DIR="$(LINUX_DIR)" \
              ARCH="$(LINUX_KARCH)" \
              CC="$(TARGET_CC)" \
              M="$(PKG_BUILD_DIR)" \
              modules
          endef

          define Build/Prepare
            mkdir -p $(PKG_BUILD_DIR)
            cp ./src/mtd-rw.c $(PKG_BUILD_DIR)/
            cat > $(PKG_BUILD_DIR)/Makefile <<'MKEOF'
          obj-m += mtd-rw.o
          MKEOF
          endef

          $(eval $(call KernelPackage,mtd-rw))
          EOF

      - name: Configure TL-7DR7299
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-7dr7299-v1=y
          CONFIG_PACKAGE_kmod-mtd-rw=m
          EOF

          make defconfig

      - name: Show kernel configuration
        working-directory: immortalwrt
        run: |
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config | grep -E 'mediatek|filogic|tl-7dr7299' || true

          echo
          echo "===== MTD-RW ====="
          grep 'CONFIG_PACKAGE_kmod-mtd-rw' .config || true

      - name: Compile kmod-mtd-rw
        working-directory: immortalwrt
        run: |
          make package/kernel/mtd-rw/compile V=s -j$(nproc)

      - name: Find generated package
        run: |
          mkdir -p output

          find immortalwrt/bin \
            -type f \
            -name 'kmod-mtd-rw_*.ipk' \
            -exec cp -v {} output/ \;

          echo
          echo "===== GENERATED PACKAGE ====="
          ls -lah output/

      - name: Check package kernel dependency
        run: |
          echo "===== IPK CONTROL ====="

          for f in output/kmod-mtd-rw_*.ipk; do
            echo
            echo "FILE: $f"
            ar p "$f" control.tar.zst | tar -xO ./control || true
          done

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: TL-7DR7299-kmod-mtd-rw
          path: output/kmod-mtd-rw_*.ipk
          if-no-files-found: error
