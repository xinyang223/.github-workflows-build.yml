name: Build TL-7DR7299 kmod-mtd-rw

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            curl \
            ca-certificates

      - name: Clone ImmortalWrt Source
        run: |
          git clone \
            --depth=1 \
            --branch mt798x-mt799x-6.6-mtwifi \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git \
            immortalwrt

      - name: Update and Install Feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for TL-7DR7299 and mtd-rw
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-7dr7299-v1=y
          CONFIG_PACKAGE_kmod-mtd-rw=m
          EOF

          # 生成完整的编译配置
          make defconfig

      - name: Compile kmod-mtd-rw
        working-directory: immortalwrt
        run: |
          # 针对包含 mtd-rw 的所有路径尝试编译
          make package/kernel/mtd-rw/compile V=s -j$(nproc) || \
          make package/feeds/packages/mtd-rw/compile V=s -j$(nproc) || \
          make package/mtd-rw/compile V=s -j$(nproc) || \
          make modules V=s -j$(nproc)

      - name: Find and Collect Generated IPK
        run: |
          mkdir -p output

          # 在所有产物路径中搜寻编译出来的 kmod-mtd-rw IPK 包
          find immortalwrt/bin \
            -type f \
            -name '*mtd-rw*.ipk' \
            -exec cp -v {} output/ \;

          echo "===== GENERATED PACKAGES ====="
          ls -lah output/

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL-7DR7299-kmod-mtd-rw
          path: output/*mtd-rw*.ipk
          if-no-files-found: error
