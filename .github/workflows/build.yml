name: Build TL-7DR7299 kmod-mtd-rw

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            curl \
            ca-certificates

      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth=1 \
            --branch mt798x-mt799x-6.6-mtwifi \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git \
            immortalwrt

      - name: Show source information
        working-directory: immortalwrt
        run: |
          echo "===== SOURCE ====="
          git log -1 --oneline
          echo
          echo "===== BRANCH ====="
          git branch --show-current

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download mtd-rw package zip
        working-directory: immortalwrt
        run: |
          mkdir -p package/kernel/mtd-rw
          # 直接下载已测试通过的 OpenWrt mtd-rw 包源码并解压
          curl -sSL https://github.com/agfwd/openwrt-mtd-rw/archive/refs/heads/master.zip -o /tmp/mtd-rw.zip
          unzip -q /tmp/mtd-rw.zip -d /tmp/mtd-rw-src
          cp -r /tmp/mtd-rw-src/openwrt-mtd-rw-master/* package/kernel/mtd-rw/
          rm -rf /tmp/mtd-rw.zip /tmp/mtd-rw-src

      - name: Configure TL-7DR7299
        working-directory: immortalwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_tplink_tl-7dr7299-v1=y
          CONFIG_PACKAGE_kmod-mtd-rw=m
          EOF

          make defconfig

      - name: Show kernel configuration
        working-directory: immortalwrt
        run: |
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config | grep -E 'mediatek|filogic|tl-7dr7299' || true

          echo
          echo "===== MTD-RW ====="
          grep 'CONFIG_PACKAGE_kmod-mtd-rw' .config || true

      - name: Compile kmod-mtd-rw
        working-directory: immortalwrt
        run: |
          make package/kernel/mtd-rw/compile V=s -j$(nproc)

      - name: Find generated package
        run: |
          mkdir -p output

          find immortalwrt/bin \
            -type f \
            -name 'kmod-mtd-rw_*.ipk' \
            -exec cp -v {} output/ \;

          echo
          echo "===== GENERATED PACKAGE ====="
          ls -lah output/

      - name: Check package kernel dependency
        run: |
          echo "===== IPK CONTROL ====="

          for f in output/kmod-mtd-rw_*.ipk; do
            echo
            echo "FILE: $f"
            ar p "$f" control.tar.zst | tar -xO ./control || true
          done

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: TL-7DR7299-kmod-mtd-rw
          path: output/kmod-mtd-rw_*.ipk
          if-no-files-found: error
